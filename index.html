<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Goodreads</title>

    <!-- Theme fonts: Plus Jakarta Sans (sans), Source Serif 4 (serif), JetBrains Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Plus+Jakarta+Sans:wght@400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
    />

    <!--
      Dark mode: toggles .dark on <html> before first paint so there's no flash.
      Follows prefers-color-scheme by default; localStorage "theme" = "light" | "dark" overrides it.
    -->
    <script>
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var stored = null
          try {
            stored = localStorage.getItem('theme')
          } catch (e) {}
          var dark = stored === 'dark' || (stored !== 'light' && media.matches)
          document.documentElement.classList.toggle('dark', dark)
        }
        apply()
        media.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

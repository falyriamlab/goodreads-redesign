<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Goodreads — Concept Redesign</title>
    <meta
      name="description"
      content="A mobile-first concept redesign of Goodreads for a UX case study: log from any cover, typo-tolerant search, a personal home and a profile built for sharing. Not affiliated with Goodreads or Amazon."
    />

    <!-- Icons: open book on the theme indigo (--primary, light) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Install name, icons and colors (npm run assets). No service worker: a deploy is never hidden behind a cache -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Browser UI color = theme --background (light / dark), as sRGB -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="rgb(231 229 228)" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="rgb(30 27 24)" />

    <!-- Link previews (1200×630, made from the Brand month share card) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Goodreads — Concept Redesign" />
    <meta property="og:title" content="Goodreads — Concept Redesign" />
    <meta property="og:description" content="A mobile-first UX case study: log from any cover, typo-tolerant search and a profile built for sharing." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Goodreads concept redesign: a monthly reading recap card on the brand indigo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Goodreads — Concept Redesign" />
    <meta name="twitter:description" content="A mobile-first UX case study: log from any cover, typo-tolerant search and a profile built for sharing." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="Goodreads concept redesign: a monthly reading recap card on the brand indigo" />

    <!-- Theme fonts: Plus Jakarta Sans (sans), Playfair Display SemiBold Italic (serif, the only cut), Roboto Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@400..800&family=Roboto+Mono:wght@400..700&display=swap"
    />

    <!--
      Dark mode: toggles .dark on <html> before first paint so there's no flash.
      Follows prefers-color-scheme by default; localStorage "theme" = "light" | "dark" overrides it.
    -->
    <script>
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var stored = null
          try {
            stored = localStorage.getItem('theme')
          } catch (e) {}
          var dark = stored === 'dark' || (stored !== 'light' && media.matches)
          document.documentElement.classList.toggle('dark', dark)
        }
        apply()
        media.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
